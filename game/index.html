<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPACE CATCHER</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="top-bar">
    <button id="profileBtn" class="top-btn menu-btn">Профиль</button>
    <button id="menuBtn" class="top-btn menu-btn">Меню</button>
    <button id="settingsBtn" class="top-btn settings-btn">Настройка</button>
    <button id="game2Btn" class="top-btn game2-btn">2-ойын</button>
    <button id="leaderboardBtn" class="top-btn leaderboard-btn">Leaderboard</button>
    <button id="logoutBtn" class="top-btn logout-btn">Шығу</button>
  </div>

  <div id="menuScreen" class="screen menu-screen">
    <div class="menu-card">
      <h1>SPACE CATCHER</h1>
      <p id="welcomeText">Шариктерді ұста. Бомбадан сақтан.</p>
      <button id="startBtn" class="start-btn">START</button>
      <button id="menuGame2Btn" class="second-game-btn">2-ОЙЫН: ESP CAR</button>
    </div>
  </div>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-header">
      <h3>Настройка</h3>
      <button id="closeSettingsBtn" class="close-btn">✕</button>
    </div>

    <div class="settings-body">
      <div class="settings-item">
        <span>BLE күйі</span>
        <strong id="bleState">Қосылмаған</strong>
      </div>
      <div class="settings-item">
        <span>Yaw</span>
        <strong id="yawVal">0.0</strong>
      </div>
      <div class="settings-item">
        <span>Pitch</span>
        <strong id="pitchVal">0.0</strong>
      </div>
      <div class="settings-item">
        <span>Roll</span>
        <strong id="rollVal">0.0</strong>
      </div>

      <div class="settings-actions">
        <button id="connectBtn" class="action-btn green">BLE қосу</button>
        <button id="disconnectBtn" class="action-btn red">Өшіру</button>
        <button id="calibBtn" class="action-btn orange">CALIB</button>
        <button id="zeroBtn" class="action-btn blue">RESET</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
