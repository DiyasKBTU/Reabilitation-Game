<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тіркелу</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="page">
    <div class="register-card">
      <h1>Тіркелу</h1>
      <p class="subtitle">Жаңа аккаунт жасаңыз</p>

      <form id="registerForm" class="register-form">
        <div class="input-box">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" placeholder="Логин" required />
        </div>

        <div class="input-box">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="Email" required />
        </div>

        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Құпия сөз" required />
        </div>

        <div class="input-box">
          <i class="fa-solid fa-shield-halved"></i>
          <input type="password" id="confirmPassword" placeholder="Құпия сөзді қайтала" required />
        </div>

        <button type="submit" class="neo-btn">Тіркелу</button>
      </form>

      <button id="loginBtn" class="neo-btn secondary-btn">Login беті</button>
      <button id="leaderboardBtn" class="neo-btn secondary-btn">Leaderboard</button>

      <p id="message" class="message"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
