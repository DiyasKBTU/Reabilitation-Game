<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Менің профилім</h1>
      <p class="sub">Қолданушы ақпараты</p>

      <div class="info-box">
        <div class="row"><span>Username:</span><strong id="username">-</strong></div>
        <div class="row"><span>Email:</span><strong id="email">-</strong></div>
        <div class="row"><span>Role:</span><strong id="role">-</strong></div>
        <div class="row"><span>Үздік score:</span><strong id="bestScore">0</strong></div>
        <div class="row"><span>Ойын саны:</span><strong id="totalGames">0</strong></div>
      </div>

      <div class="actions">
        <button id="toGame">Game</button>
        <button id="toLeaderboard">Leaderboard</button>
        <button id="logoutBtn" class="danger">Шығу</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
