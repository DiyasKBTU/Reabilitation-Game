<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кіру</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="page">
    <div class="login-card">
      <h1>Кіру</h1>
      <p class="subtitle">Басқару панеліне қош келдіңіз</p>

      <form id="loginForm" class="login-form">
        <div class="input-box">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" placeholder="Логин" required />
        </div>

        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Құпия сөз" required />
        </div>

        <button type="submit" class="neo-btn">Жүйеге кіру</button>
      </form>

      <button id="registerBtn" class="neo-btn secondary-btn">Register беті</button>
      <button id="leaderboardBtn" class="neo-btn secondary-btn">Leaderboard</button>

      
      <p id="message" class="message"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>ы
</html>
