# Axis web — прод-раздача собранной SPA + прокси /api на backend.
# Используется образом из web/Dockerfile (docker-compose.prod.yml).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API — проксируем на FastAPI внутри docker-сети (same-origin, CORS не нужен).
    # Резолв через переменную + Docker DNS: nginx не падает на старте,
    # если контейнер api ещё не поднялся или перезапускается.
    location /api/ {
        # Дефолт 1m терял длинные сессии: ряд IMU 25 Гц за ~15 минут игры превышает 1 МБ →
        # nginx отвечал 413 и результат пациента пропадал. 16m покрывает ~2 часа записи.
        client_max_body_size 16m;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Хэшированные ассеты Vite можно кэшировать надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Автономные инструменты (tools/imu-recorder, tools/imu-simulator) — статика вне SPA.
    # Раздаются тем же HTTPS-доменом: Web Bluetooth работает только в secure context,
    # поэтому запись с датчика с чужих устройств возможна только отсюда.
    location /tools/ {
        try_files $uri $uri/ =404;
    }

    # SPA fallback — все маршруты React Router отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
