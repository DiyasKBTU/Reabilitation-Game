# Axis — постоянный HTTPS через общий Caddy сервера. ✅ Так работает прод.
# Обычный prod-стек его не подхватывает — включается вторым -f:
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
#
# Порт 443 на сервере один на все проекты, поэтому Caddy вынесен в /opt/caddy и ни
# одному проекту не принадлежит: остановка, обновление или down нашего стека не
# задевает соседние сайты, и наоборот. Наш домен — в /opt/caddy/conf/sites/rehabgame.caddy
# (reverse_proxy rehabgame-web:80), сертификат Let's Encrypt выпускает и продлевает
# общий Caddy. Этот файл только подключает web к его сети edge (подробно: docs/DEPLOY.md, шаг 7B).
#
# Сеть edge создаётся вместе с общим Caddy (/opt/caddy/README.md на сервере). Без неё
# compose скажет «network edge declared as external, but could not be found».

services:
  web:
    networks:
      default:
      edge:

networks:
  edge:
    external: true
